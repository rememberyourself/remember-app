<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Simple friendly person/smiley face in Remember line-art style -->
  <!-- Gold color matching other icons: #C9A96E -->
  
  <!-- Head circle -->
  <circle cx="50" cy="38" r="22" fill="none" stroke="#C9A96E" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Left eye - small dot -->
  <circle cx="41" cy="34" r="3" fill="#C9A96E"/>
  
  <!-- Right eye - small dot -->
  <circle cx="59" cy="34" r="3" fill="#C9A96E"/>
  
  <!-- Gentle smile -->
  <path d="M 40 44 Q 50 52 60 44" fill="none" stroke="#C9A96E" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Shoulders/body hint -->
  <path d="M 25 80 Q 25 62 50 62 Q 75 62 75 80" fill="none" stroke="#C9A96E" stroke-width="5" stroke-linecap="round"/>
</svg>
