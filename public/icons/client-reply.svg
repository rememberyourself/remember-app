<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Friendly face icon - head only, no body, Remember gold line-art style -->
  <!-- Transparent background -->
  
  <!-- Head circle - larger, centered -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#C9A96E" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Left eye - friendly dot -->
  <circle cx="38" cy="44" r="3.5" fill="#C9A96E"/>
  
  <!-- Right eye - friendly dot -->
  <circle cx="62" cy="44" r="3.5" fill="#C9A96E"/>
  
  <!-- Gentle warm smile -->
  <path d="M 36 58 Q 50 68 64 58" fill="none" stroke="#C9A96E" stroke-width="4.5" stroke-linecap="round"/>
</svg>
