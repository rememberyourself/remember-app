<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Coach icon - gold line-art, transparent bg, ~15% bigger than client icon -->
  
  <!-- Head circle - slightly larger than client (r=75 vs r=70) -->
  <circle cx="100" cy="105" r="75" fill="none" stroke="#C9A96E" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Left eye - open, clear circle with pupil -->
  <circle cx="75" cy="92" r="10" fill="none" stroke="#C9A96E" stroke-width="4"/>
  <circle cx="75" cy="92" r="4.5" fill="#C9A96E"/>
  
  <!-- Right eye - wink (closed) -->
  <path d="M 118 92 Q 125 82 132 92" fill="none" stroke="#C9A96E" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Warm smile -->
  <path d="M 68 122 Q 100 148 132 122" fill="none" stroke="#C9A96E" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Small star/spark above head -->
  <path d="M 100 18 L 103 8 L 106 18 L 116 15 L 109 22 L 116 29 L 106 26 L 103 36 L 100 26 L 90 29 L 97 22 L 90 15 Z" fill="#C9A96E" stroke="none"/>
</svg>
