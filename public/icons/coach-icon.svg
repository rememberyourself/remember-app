<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Coach icon - wise/warm face with subtle detail, gold line-art, transparent bg -->
  
  <!-- Head circle -->
  <circle cx="100" cy="105" r="65" fill="none" stroke="#C9A96E" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Left eye - friendly dot -->
  <circle cx="78" cy="95" r="6" fill="#C9A96E"/>
  
  <!-- Right eye - wink -->
  <path d="M 115 95 Q 122 88 129 95" fill="none" stroke="#C9A96E" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Warm smile -->
  <path d="M 72 118 Q 100 140 128 118" fill="none" stroke="#C9A96E" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Small star/spark above head — coach wisdom -->
  <path d="M 100 28 L 103 18 L 106 28 L 116 25 L 109 32 L 116 39 L 106 36 L 103 46 L 100 36 L 90 39 L 97 32 L 90 25 Z" fill="#C9A96E" stroke="none"/>
</svg>
